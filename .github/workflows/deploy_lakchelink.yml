name: Deploy LakcheLink

on:
  push:
    branches:
      - lakchelink-main
  workflow_dispatch:
    inputs:
      target_environment:
        description: "Deployment target"
        required: true
        type: choice
        default: production
        options:
          - staging
          - production
      git_ref:
        description: "Git ref to deploy"
        required: true
        default: lakchelink-main

concurrency:
  group: deploy-lakchelink-${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'workflow_dispatch' && inputs.target_environment || 'staging' }}

    env:
      VPS_HOST: ${{ secrets.VPS_HOST }}
      VPS_USER: ${{ secrets.VPS_USER || 'root' }}
      VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
      VPS_PASSWORD: ${{ secrets.VPS_PASSWORD }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/opt/lakchelink' }}
      COMPOSE_FILE: ${{ secrets.COMPOSE_FILE || 'docker-compose.production.yaml' }}
      HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL || 'http://127.0.0.1:3000/api' }}

    steps:
      - name: 1. Checkout source code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.git_ref || github.ref }}

      - name: 2. Install deployment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync sshpass

      - name: 3. Test VPS connection
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "echo 'VPS connection successful'"

      - name: 4. Create deployment directory
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "mkdir -p '$DEPLOY_PATH'"

      - name: 5. Sync source code to VPS
        run: |
          sshpass -p "$VPS_PASSWORD" rsync -az --delete \
            -e "ssh -p $VPS_PORT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            --exclude '.git' \
            --exclude '.github/workflows/deploy_lakchelink.yml' \
            --exclude 'node_modules' \
            --exclude 'log' \
            --exclude 'tmp' \
            --exclude 'storage' \
            --exclude '.env' \
            ./ "${VPS_USER}@${VPS_HOST}:${DEPLOY_PATH}/"

      - name: 6. Validate Docker Compose configuration
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && docker compose -f '$COMPOSE_FILE' config --quiet"

      - name: 7. Start PostgreSQL and Redis
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && docker compose -f '$COMPOSE_FILE' up -d postgres redis"

      - name: 8. Build new application image
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && docker compose -f '$COMPOSE_FILE' build"

      - name: 9. Prepare database
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && docker compose -f '$COMPOSE_FILE' run --rm rails bundle exec rails db:chatwoot_prepare"

      - name: 10. Start new application containers
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && docker compose -f '$COMPOSE_FILE' up -d --no-build --remove-orphans"

      - name: 11. Show container status
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "cd '$DEPLOY_PATH' && docker compose -f '$COMPOSE_FILE' ps"

      - name: 12. Check application health
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "DEPLOY_PATH='$DEPLOY_PATH' COMPOSE_FILE='$COMPOSE_FILE' HEALTHCHECK_URL='$HEALTHCHECK_URL' bash -s" <<'EOF'
          set -e

          for attempt in $(seq 1 20); do
            if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then
              echo "LakcheLink is healthy"
              exit 0
            fi

            echo "Health check attempt ${attempt}/20 failed"
            sleep 5
          done

          echo "Application failed its health check"
          cd "$DEPLOY_PATH"
          docker compose -f "$COMPOSE_FILE" ps
          docker compose -f "$COMPOSE_FILE" logs --tail=100 rails
          exit 1
          EOF

      - name: 13. Clean unused Docker images
        if: success()
        run: |
          sshpass -p "$VPS_PASSWORD" ssh \
            -p "$VPS_PORT" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${VPS_USER}@${VPS_HOST}" \
            "docker image prune -f"
