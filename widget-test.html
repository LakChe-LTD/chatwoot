<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LakcheLink Widget Test</title>
  </head>
  <body>
    <h1>LakcheLink Widget Test</h1>
    <p>Open this page in the browser and the staging widget should appear on the right.</p>

    <script>
      window.chatwootSettings = { position: 'right', type: 'standard', launcherTitle: '' };
      (function (d, t) {
        var BASE_URL = 'https://staging.lakchelink.com';
        var g = d.createElement(t),
          s = d.getElementsByTagName(t)[0];
        g.src = BASE_URL + '/packs/js/sdk.js';
        g.async = true;
        s.parentNode.insertBefore(g, s);
        g.onload = function () {
          window.chatwootSDK.run({
            websiteToken: 'DonMznMkE5hQ9Ffv5HnGhoDm',
            baseUrl: BASE_URL,
          });
        };
      })(document, 'script');
    </script>
  </body>
</html>
