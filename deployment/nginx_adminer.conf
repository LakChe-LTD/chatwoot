upstream adminer_backend {
  zone upstreams 64K;
  server 127.0.0.1:8081;
  keepalive 32;
}

server {
  listen 80;
  listen [::]:80;
  server_name db.lakchelink.com;

  access_log /var/log/nginx/adminer_access_80.log;
  error_log /var/log/nginx/adminer_error_80.log;

  return 301 https://db.lakchelink.com$request_uri;
}

server {
  listen 443 ssl http2 reuseport;
  listen [::]:443 ssl http2 reuseport;
  server_name db.lakchelink.com;

  access_log /var/log/nginx/adminer_access_443.log;
  error_log /var/log/nginx/adminer_error_443.log;

  auth_basic "Restricted";
  auth_basic_user_file /etc/nginx/.htpasswd-adminer;

  location / {
    proxy_pass http://adminer_backend;
    proxy_redirect off;

    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Ssl on;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
  }

  ssl_certificate /etc/letsencrypt/live/db.lakchelink.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/db.lakchelink.com/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
  ssl_prefer_server_ciphers off;
  ssl_dhparam /etc/ssl/dhparam;
  ssl_early_data on;
  ssl_buffer_size 4k;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
}
